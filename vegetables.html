<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Composer - Типы овощей</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo-link">
            <img src="public/icons/logo.png" alt="Recipe Composer Logo" class="logo">
        </a>
        <a href="index.html">Главная</a>
        <a href="about.html">О наших рецептах</a>
        <a href="favorites.html">Избранное</a>
    </nav>

    <div class="main_categories">
        <img src="./public/backgrounds/book.png" alt="Книга с блюдами" class="book-background">
        <div class="categories-container">
            <!-- Левая страница -->
            <div class="category-item" data-position="1">
                <a href="#" class="category-card" data-category="tomato">
                    <img src="./public/food/tomato.png" alt="Помидоры" class="category-image">
                </a>
                <h2 class="category-title">Помидоры</h2>
            </div>

            <!-- Правая страница -->
            <div class="category-item" data-position="2">
                <a href="#" class="category-card" data-category="cucumber">
                    <img src="./public/food/cucumber.png" alt="Огурцы" class="category-image">
                </a>
                <h2 class="category-title">Огурцы</h2>
            </div>
            
            <!-- Стрелка для навигации к огурцам -->
            <a href="#" class="navigation-arrow to-cucumber">
                <div class="arrow-simple">›</div>
            </a>

            <!-- Левая страница -->
            <div class="category-item" data-position="3">
                <a href="#" class="category-card" data-category="potato">
                    <img src="./public/food/potato.png" alt="Картофель" class="category-image">
                </a>
                <h2 class="category-title">Картофель</h2>
            </div>
            
            <!-- Стрелка для возврата к категориям -->
            <a href="categories.html" class="navigation-arrow to-categories">
                <div class="arrow-simple">›</div>
            </a>
            
            <!-- Стрелка для перехода к мясу -->
            <a href="meat.html" class="navigation-arrow to-meat">
                <div class="arrow-simple">›</div>
            </a>

            <!-- Можно добавить и другие типы овощей при необходимости -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загружаем сохраненную выбранную категорию
            let selectedCategory = localStorage.getItem('selectedVegetableType') || '';
            
            // Применяем выделение к сохраненной категории
            if (selectedCategory) {
                const element = document.querySelector(`[data-category="${selectedCategory}"]`);
                if (element) {
                    element.classList.add('selected');
                }
            }

            // Обработчик клика по категории
            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    const category = this.dataset.category;
                    
                    // Снимаем выделение со всех категорий
                    document.querySelectorAll('.category-card').forEach(c => {
                        c.classList.remove('selected');
                    });
                    
                    // Если кликнули на уже выбранную категорию - снимаем выбор
                    if (selectedCategory === category) {
                        selectedCategory = '';
                    } else {
                        // Иначе выбираем новую категорию
                        this.classList.add('selected');
                        selectedCategory = category;
                    }
                    
                    // Сохраняем выбранную категорию
                    localStorage.setItem('selectedVegetableType', selectedCategory);
                });
            });
            
            // Обработчики для стрелок навигации
            document.querySelector('.to-cucumber').addEventListener('click', function(e) {
                e.preventDefault();
                // Находим карточку с огурцами и имитируем клик
                document.querySelector('[data-category="cucumber"]').click();
            });

            // Обработчик для возврата к общим категориям
            document.querySelector('.to-categories').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'categories.html';
            });
            
            // Обработчик для перехода на страницу мяса
            document.querySelector('.to-meat').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'meat.html';
            });
        });
    </script>
</body>
</html>
