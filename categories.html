<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Composer - Категории блюд</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
    <script src="js/categories.js"></script>
</head>
<body class="page">
    <nav class="nav">
        <a href="index.html" class="nav__logo-link">
            <img src="public/icons/logo.png" alt="Recipe Composer Logo" class="nav__logo">
        </a>
        <a href="index.html" class="nav__link">Главная</a>
        <a href="about.html" class="nav__link">О наших рецептах</a>
        <a href="favorites.html" class="nav__link">Избранное</a>
    </nav>

    <main class="categories">
        <img src="./public/backgrounds/book.png" alt="Книга с блюдами" class="categories__book-background">
        <div class="categories__container">
            <!-- Закуска -->
            <div class="category category--position-1">
                <a href="#" class="category__card" data-category="snack">
                    <img src="./public/food/snack.png" alt="Закуска" class="category__image">
                </a>
                <h2 class="category__title">Закуска</h2>
            </div>

            <!-- Суп -->
            <div class="category category--position-2">
                <a href="#" class="category__card" data-category="soup">
                    <img src="./public/food/soup.png" alt="Суп" class="category__image">
                </a>
                <h2 class="category__title">Суп</h2>
            </div>

            <!-- Напиток -->
            <div class="category category--position-3">
                <a href="#" class="category__card" data-category="drink">
                    <img src="./public/food/drink.png" alt="Напиток" class="category__image">
                </a>
                <h2 class="category__title">Напиток</h2>
            </div>

            <!-- Основное Блюдо -->
            <div class="category category--position-4">
                <a href="meat.html" class="category__card" data-category="main">
                    <img src="./public/food/main_dish.png" alt="Основное Блюдо" class="category__image">
                </a>
                <h2 class="category__title">Основное Блюдо</h2>
            </div>
            
            <!-- Стрелка для перехода на страницу с типами мяса -->
            <a href="meat.html" class="nav-arrow nav-arrow--to-meat">
                <div class="nav-arrow__symbol">›</div>
            </a>

            <!-- Десерт -->
            <div class="category category--position-5">
                <a href="#" class="category__card" data-category="dessert">
                    <img src="./public/food/dessert.png" alt="Десерт" class="category__image">
                </a>
                <h2 class="category__title">Десерт</h2>
            </div>

            <!-- Гарнир -->
            <div class="category category--position-6">
                <a href="#" class="category__card" data-category="garnish">
                    <img src="./public/food/garnish.png" alt="Гарнир" class="category__image">
                </a>
                <h2 class="category__title">Гарнир</h2>
            </div>

            <!-- Выпечка -->
            <div class="category category--position-7">
                <a href="#" class="category__card" data-category="bakery">
                    <img src="./public/food/backery.png" alt="Выпечка" class="category__image">
                </a>
                <h2 class="category__title">Выпечка</h2>
            </div>
        </div>
    </main>
</body>
</html>
