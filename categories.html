<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Composer - Категории блюд</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo-link">
            <img src="public/icons/logo.png" alt="Recipe Composer Logo" class="logo">
        </a>
        <a href="index.html">Главная</a>
        <a href="about.html">О наших рецептах</a>
        <a href="favorites.html">Избранное</a>
    </nav>

    <div class="main_categories">
        <img src="./public/backgrounds/book.png" alt="Книга с блюдами" class="book-background">
        <div class="categories-container">
            <!-- Левая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="snack">
                    <img src="./public/food/snack.png" alt="Закуска" class="category-image">
                </a>
                <h2 class="category-title">Закуска</h2>
            </div>

            <!-- Правая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="soup">
                    <img src="./public/food/soup.png" alt="Суп" class="category-image">
                </a>
                <h2 class="category-title">Суп</h2>
            </div>

            <!-- Левая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="drink">
                    <img src="./public/food/drink.png" alt="Напиток" class="category-image">
                </a>
                <h2 class="category-title">Напиток</h2>
            </div>

            <!-- Правая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="main">
                    <img src="./public/food/main_dish.png" alt="Основное Блюдо" class="category-image">
                </a>
                <h2 class="category-title">Основное Блюдо</h2>
            </div>

            <!-- Левая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="dessert">
                    <img src="./public/food/dessert.png" alt="Десерт" class="category-image">
                </a>
                <h2 class="category-title">Десерт</h2>
            </div>

            <!-- Правая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="garnish">
                    <img src="./public/food/garnish.png" alt="Гарнир" class="category-image">
                </a>
                <h2 class="category-title">Гарнир</h2>
            </div>

            <!-- Левая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="bakery">
                    <img src="./public/food/backery.png" alt="Выпечка" class="category-image">
                </a>
                <h2 class="category-title">Выпечка</h2>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загружаем сохраненную выбранную категорию
            let selectedCategory = localStorage.getItem('selectedFoodCategory') || '';
            
            // Применяем выделение к сохраненной категории
            if (selectedCategory) {
                const element = document.querySelector(`[data-category="${selectedCategory}"]`);
                if (element) {
                    element.classList.add('selected');
                }
            }

            // Обработчик клика по категории
            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    const category = this.dataset.category;
                    
                    // Снимаем выделение со всех категорий
                    document.querySelectorAll('.category-card').forEach(c => {
                        c.classList.remove('selected');
                    });
                    
                    // Если кликнули на уже выбранную категорию - снимаем выбор
                    if (selectedCategory === category) {
                        selectedCategory = '';
                    } else {
                        // Иначе выбираем новую категорию
                        this.classList.add('selected');
                        selectedCategory = category;
                    }
                    
                    // Сохраняем выбранную категорию
                    localStorage.setItem('selectedFoodCategory', selectedCategory);
                });
            });
        });
    </script>
</body>
</html>
