<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Composer - Типы мяса</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
</head>
<body>
    <nav>
        <a href="index.html" class="logo-link">
            <img src="public/icons/logo.png" alt="Recipe Composer Logo" class="logo">
        </a>
        <a href="index.html">Главная</a>
        <a href="about.html">О наших рецептах</a>
        <a href="favorites.html">Избранное</a>
    </nav>

    <div class="main_categories">
        <img src="./public/backgrounds/book.png" alt="Книга с блюдами" class="book-background">
        <a href="categories.html" class="back-button">
            <span class="back-arrow">←</span> Назад к категориям
        </a>
        <div class="categories-container">
            <!-- Левая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="beef">
                    <img src="./public/food/beef.png" alt="Говядина" class="category-image">
                </a>
                <h2 class="category-title">Говядина</h2>
            </div>

            <!-- Правая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="chicken">
                    <img src="./public/food/chicken.png" alt="Курица" class="category-image">
                </a>
                <h2 class="category-title">Курица</h2>
            </div>

            <!-- Левая страница -->
            <div class="category-item">
                <a href="#" class="category-card" data-category="mutton">
                    <img src="./public/food/mutton.png" alt="Баранина" class="category-image">
                </a>
                <h2 class="category-title">Баранина</h2>
            </div>

            <!-- Можно добавить и другие типы мяса при необходимости -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загружаем сохраненную выбранную категорию
            let selectedCategory = localStorage.getItem('selectedMeatType') || '';
            
            // Применяем выделение к сохраненной категории
            if (selectedCategory) {
                const element = document.querySelector(`[data-category="${selectedCategory}"]`);
                if (element) {
                    element.classList.add('selected');
                }
            }

            // Обработчик клика по категории
            document.querySelectorAll('.category-card').forEach(card => {
                card.addEventListener('click', function(e) {
                    e.preventDefault();
                    const category = this.dataset.category;
                    
                    // Снимаем выделение со всех категорий
                    document.querySelectorAll('.category-card').forEach(c => {
                        c.classList.remove('selected');
                    });
                    
                    // Если кликнули на уже выбранную категорию - снимаем выбор
                    if (selectedCategory === category) {
                        selectedCategory = '';
                    } else {
                        // Иначе выбираем новую категорию
                        this.classList.add('selected');
                        selectedCategory = category;
                    }
                    
                    // Сохраняем выбранную категорию
                    localStorage.setItem('selectedMeatType', selectedCategory);
                });
            });
        });
    </script>
</body>
</html>
