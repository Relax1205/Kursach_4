<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Composer - Типы мяса</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
    <script src="js/products.js"></script>
    <script src="js/meat.js"></script>
</head>
<body class="page">
    <nav class="nav">
        <a href="index.html" class="nav__logo-link">
            <img src="public/icons/logo.png" alt="Recipe Composer Logo" class="nav__logo">
        </a>
        <a href="index.html" class="nav__link">Главная</a>
        <a href="about.html" class="nav__link">О наших рецептах</a>
        <a href="favorites.html" class="nav__link">Избранное</a>
    </nav>

    <main class="product-page">
        <img src="./public/backgrounds/book.png" alt="Книга с блюдами" class="product-page__book-background">
        <div class="product-page__container">
            <!-- Говядина -->
            <div class="product product--position-1">
                <a href="#" class="product__card" data-category="beef">
                    <img src="./public/food/beef.png" alt="Говядина" class="product__image">
                </a>
                <h2 class="product__title">Говядина</h2>
            </div>

            <!-- Курица -->
            <div class="product product--position-2">
                <a href="#" class="product__card" data-category="chicken">
                    <img src="./public/food/chicken.png" alt="Курица" class="product__image">
                </a>
                <h2 class="product__title">Курица</h2>
            </div>
            
            <!-- Стрелка для навигации к курице -->
            <a href="#" class="nav-arrow nav-arrow--to-chicken">
                <div class="nav-arrow__symbol">›</div>
            </a>

            <!-- Баранина -->
            <div class="product product--position-3">
                <a href="#" class="product__card" data-category="mutton">
                    <img src="./public/food/mutton.png" alt="Баранина" class="product__image">
                </a>
                <h2 class="product__title">Баранина</h2>
            </div>
            
            <!-- Стрелка для возврата к категориям -->
            <a href="categories.html" class="nav-arrow nav-arrow--to-categories">
                <div class="nav-arrow__symbol">›</div>
            </a>
            
            <!-- Стрелка для перехода к овощам -->
            <a href="vegetables.html" class="nav-arrow nav-arrow--to-vegetables">
                <div class="nav-arrow__symbol">›</div>
            </a>
        </div>
    </main>
</body>
</html>
