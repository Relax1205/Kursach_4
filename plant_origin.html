<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Composer - Продукты растительного происхождения</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
    <script src="js/products.js"></script>
    <script src="js/plant_origin.js"></script>
</head>
<body class="page">
    <nav class="nav">
        <a href="index.html" class="nav__logo-link">
            <img src="public/icons/logo.png" alt="Recipe Composer Logo" class="nav__logo">
        </a>
        <a href="index.html" class="nav__link">Главная</a>
        <a href="about.html" class="nav__link">О наших рецептах</a>
        <a href="favorites.html" class="nav__link">Избранное</a>
    </nav>

    <main class="product-page">
        <img src="./public/backgrounds/book.png" alt="Книга с блюдами" class="product-page__book-background">
        <div class="product-page__container">
            <!-- Рис -->
            <div class="product product--position-1">
                <a href="#" class="product__card" data-category="rice">
                    <img src="./public/food/plant_origin/rice.png" alt="Рис" class="product__image">
                </a>
                <h2 class="product__title">Рис</h2>
            </div>

            <!-- Гречка -->
            <div class="product product--position-2">
                <a href="#" class="product__card" data-category="buckwheat">
                    <img src="./public/food/plant_origin/buckwheat.png" alt="Гречка" class="product__image">
                </a>
                <h2 class="product__title">Гречка</h2>
            </div>

            <!-- Макароны -->
            <div class="product product--position-3">
                <a href="#" class="product__card" data-category="pasta">
                    <img src="./public/food/plant_origin/pasta.png" alt="Макароны" class="product__image">
                </a>
                <h2 class="product__title">Макароны</h2>
            </div>

            <!-- Фасоль -->
            <div class="product product--position-4">
                <a href="#" class="product__card" data-category="beans">
                    <img src="./public/food/plant_origin/beans.png" alt="Фасоль" class="product__image">
                </a>
                <h2 class="product__title">Фасоль</h2>
            </div>

            <!-- Растительное масло -->
            <div class="product product--position-5">
                <a href="#" class="product__card" data-category="oil">
                    <img src="./public/food/plant_origin/oil.png" alt="Растительное масло" class="product__image">
                </a>
                <h2 class="product__title">Раст. масло</h2>
            </div>

            <!-- Тофу -->
            <div class="product product--position-6">
                <a href="#" class="product__card" data-category="flour">
                    <img src="./public/food/plant_origin/flour.png" alt="Мука" class="product__image">
                </a>
                <h2 class="product__title">Мука</h2>
            </div>
            
            <!-- Стрелка для возврата к продуктам животного происхождения -->
            <a href="animal_origin.html" class="nav-arrow nav-arrow--left">
                <div class="nav-arrow__symbol">›</div>
            </a>
            
            <!-- Стрелка для перехода к списку -->
            <a href="list.html" class="nav-arrow nav-arrow--right">
                <div class="nav-arrow__symbol">›</div>
            </a>
        </div>
    </main>
</body>
</html>
