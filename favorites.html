<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Composer - Избранное</title>
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bad+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/list.css">
    <script src="js/favorites.js" defer></script>
</head>
<body class="page">
    <nav class="nav">
        <a href="index.html" class="nav__logo-link">
            <img src="public/icons/logo.png" alt="Recipe Composer Logo" class="nav__logo">
        </a>
        <a href="index.html" class="nav__link">Главная</a>
        <a href="about.html" class="nav__link">О наших рецептах</a>
        <a href="favorites.html" class="nav__link nav__link--selected">Избранное</a>
    </nav>

    <main class="product-page">
        <img src="./public/backgrounds/book.png" alt="Книга с блюдами" class="product-page__book-background">
        <div class="product-page__container">
            <div id="favorites-list-container" class="selected-list">
                <h2>Избранные рецепты:</h2>
                <ul id="favorites-list-ul"></ul>
            </div>
        </div>
    <div id="recipe-modal" class="modal">
        <div class="modal-content">
            <span class="modal-close-button" id="modal-close-button">&times;</span>
            <h2 id="modal-recipe-title">Название рецепта</h2>
            <div id="modal-recipe-content" style="white-space: pre-wrap;"></div>
        </div>
    </div>
</body>
</html>
